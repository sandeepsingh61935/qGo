<svg xmlns="http://www.w3.org/2000/svg" width="780" height="560" viewBox="0 0 780 560" role="img" aria-label="qGo lab throughput: what each scenario measures">
  <rect width="780" height="560" fill="#0f1419"/>
  <text x="36" y="36" fill="#e7ecf1" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" font-weight="700">qGo — lab throughput by scenario</text>
  <text x="36" y="58" fill="#a8b6c5" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">Jobs/sec through Redis list primitives (not multi-AZ SLOs). Higher bar = more ops/s on this machine.</text>
  <text x="36" y="78" fill="#8b9aab" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">Setup: Redis local · 5000 jobs · 8 producers · 8 consumers · 75B payload · 8 CPUs · 1.26.5-X:nodwarf5</text>
  <g stroke="#243040" stroke-width="1">
    <line x1="170" y1="300" x2="720" y2="300"/>
    <line x1="170" y1="250" x2="720" y2="250"/>
    <line x1="170" y1="200" x2="720" y2="200"/>
    <line x1="170" y1="150" x2="720" y2="150"/>
    <line x1="170" y1="100" x2="720" y2="100"/>
  </g>
  <g fill="#8b9aab" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" text-anchor="end">
    <text x="162" y="304">0</text>
    <text x="162" y="254">6.2k</text>
    <text x="162" y="204">12.5k</text>
    <text x="162" y="154">18.8k</text>
    <text x="162" y="104">25.0k</text>
  </g>
  <text x="48" y="200" fill="#5c6b7a" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" transform="rotate(-90 48 200)">throughput (ops/s)</text>
  <rect x="200" y="237" width="78" height="63" fill="#3d8bfd" rx="5"/>
  <text x="239" y="219" fill="#e7ecf1" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="middle">7.9k</text>
  <text x="239" y="233" fill="#8b9aab" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" text-anchor="middle">p50 0.12ms</text>
  <text x="239" y="318" fill="#c5d0db" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" text-anchor="middle">Enqueue</text>
  <text x="239" y="332" fill="#c5d0db" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" text-anchor="middle">seq</text>
  <rect x="314" y="130" width="78" height="170" fill="#3dd68c" rx="5"/>
  <text x="353" y="112" fill="#e7ecf1" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="middle">21.3k</text>
  <text x="353" y="126" fill="#8b9aab" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" text-anchor="middle">p50 0.36ms</text>
  <text x="353" y="318" fill="#c5d0db" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" text-anchor="middle">Enqueue</text>
  <text x="353" y="332" fill="#c5d0db" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" text-anchor="middle">parallel</text>
  <rect x="428" y="185" width="78" height="115" fill="#f5a524" rx="5"/>
  <text x="467" y="167" fill="#e7ecf1" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="middle">14.4k</text>
  <text x="467" y="181" fill="#8b9aab" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" text-anchor="middle">p50 0.56ms</text>
  <text x="467" y="318" fill="#c5d0db" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" text-anchor="middle">Dequeue</text>
  <text x="467" y="332" fill="#c5d0db" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" text-anchor="middle">parallel</text>
  <rect x="542" y="247" width="78" height="53" fill="#f31260" rx="5"/>
  <text x="581" y="229" fill="#e7ecf1" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="middle">6.6k</text>
  <text x="581" y="243" fill="#8b9aab" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" text-anchor="middle">sojourn p50 126ms</text>
  <text x="581" y="318" fill="#c5d0db" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" text-anchor="middle">E2E</text>
  <text x="581" y="332" fill="#c5d0db" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" text-anchor="middle">throughput</text>
  <text x="36" y="340" fill="#e7ecf1" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600">What each bar measures</text>
  <rect x="36" y="352" width="12" height="12" rx="2" fill="#3d8bfd"/>
  <text x="56" y="362" fill="#c5d0db" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12"><tspan fill="#e7ecf1" font-weight="600">Enqueue (1 worker)</tspan>  —  SETNX + RPUSH, single goroutine — baseline RTT</text>
  <rect x="36" y="374" width="12" height="12" rx="2" fill="#3dd68c"/>
  <text x="56" y="384" fill="#c5d0db" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12"><tspan fill="#e7ecf1" font-weight="600">Enqueue (N producers)</tspan>  —  Same path, concurrent producers — scales until Redis contends</text>
  <rect x="36" y="396" width="12" height="12" rx="2" fill="#f5a524"/>
  <text x="56" y="406" fill="#c5d0db" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12"><tspan fill="#e7ecf1" font-weight="600">Dequeue (N consumers)</tspan>  —  RPOPLPUSH + visibility stamp on a pre-filled queue</text>
  <rect x="36" y="418" width="12" height="12" rx="2" fill="#f31260"/>
  <text x="56" y="428" fill="#c5d0db" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12"><tspan fill="#e7ecf1" font-weight="600">E2E produce→consume</tspan>  —  Parallel enqueue + dequeue + complete (no-op handler)</text>
  <rect x="36" y="452" width="708" height="44" rx="6" fill="#1a2330" stroke="#2c3a4d"/>
  <text x="48" y="468" fill="#f5a524" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600">Read this in an interview</text>
  <text x="48" y="484" fill="#a8b6c5" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">E2E latency note: sojourn p50 ≈ 126ms (includes queue wait when producers outrun consumers).</text>
  <text x="48" y="498" fill="#a8b6c5" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">Process-only p50 ≈ 1.01ms (dequeue→complete, no-op handler).</text>
  <text x="36" y="544" fill="#5c6b7a" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10">Single-host lab result · regenerate: go run ./cmd/bench -json bench-results.json &amp;&amp; go run ./scripts/bench-chart.go</text>
</svg>
